<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logga in — Tierplay</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;1,400&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1120; --panel:#16203A; --line:rgba(235,242,250,.12);
    --chalk:#F0F5FA; --muted:#9AA8BC;
    --brand:#1FBF6B; --brand2:#A8E92E;
    --grad:linear-gradient(100deg,var(--brand),var(--brand2));
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--chalk);font-family:'Archivo',system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:grid;place-items:center;padding:32px 24px;
    background-image:radial-gradient(700px 420px at 50% -10%, color-mix(in srgb, var(--brand) 20%, transparent), transparent 62%)}
  a{color:inherit;text-decoration:none}
  .box{width:100%;max-width:420px}
  .brandrow{display:flex;align-items:center;gap:13px;justify-content:center;margin-bottom:26px}
  .crest{width:46px;height:46px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-family:'Archivo Black',sans-serif;font-size:17px;color:#08260f;overflow:hidden}
  .crest img{width:100%;height:100%;object-fit:contain;background:#fff}
  .brandtext{font-family:'Archivo Black',sans-serif;font-size:20px;text-transform:uppercase;letter-spacing:.03em}
  .brandsub{font-size:12.5px;color:var(--muted);margin-top:-4px;text-transform:none;letter-spacing:0;font-family:'Archivo',sans-serif}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px}
  h1{font-family:'Archivo Black',sans-serif;font-size:23px;text-transform:uppercase;margin-bottom:6px}
  .sub{color:var(--muted);font-size:15px;margin-bottom:24px}
  label{display:block;font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:16px 0 7px}
  input{width:100%;background:rgba(235,242,250,.04);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;color:var(--chalk);font-size:16px;font-family:inherit;outline:none;transition:border-color .15s}
  input:focus{border-color:var(--brand)}
  input::placeholder{color:rgba(154,168,188,.55)}
  .btn{width:100%;margin-top:24px;padding:14px;border-radius:999px;font-weight:600;font-size:16px;background:var(--grad);color:#08260f;border:none;cursor:pointer;font-family:inherit;transition:transform .15s}
  .btn:hover{transform:translateY(-1px)}
  .btn:disabled{opacity:.55;transform:none;cursor:default}
  .msg{margin-top:16px;font-size:14.5px;min-height:20px}
  .msg.err{color:#FF8B7E}
  .msg.ok{color:var(--brand2)}
  .foot{text-align:center;margin-top:22px;font-size:13.5px;color:var(--muted)}
  .foot a{color:var(--brand2)}
  .tp{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:26px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="box">
  <div class="brandrow">
    <div class="crest" id="crest">
      <svg viewBox="0 0 92 68" width="26" height="19" aria-hidden="true"><rect x="0" y="0" width="64" height="16" rx="8" fill="#08260f" opacity=".85"/><rect x="0" y="26" width="46" height="16" rx="8" fill="#08260f" opacity=".55"/><rect x="0" y="52" width="30" height="16" rx="8" fill="#08260f" opacity=".3"/><circle cx="78" cy="8" r="9" fill="#08260f"/></svg>
    </div>
    <div>
      <div class="brandtext" id="brandName">Tierplay</div>
      <div class="brandsub" id="brandSub">Administration</div>
    </div>
  </div>

  <div class="card">
    <h1 id="title">Logga in</h1>
    <p class="sub" id="subtitle">Logga in för att se dina stegar, din placering och kommande matcher.</p>

    <form id="loginForm">
      <label for="email">E-post</label>
      <input type="email" id="email" placeholder="din@mejladress.se" autocomplete="email" required>

      <label for="password" style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
        <span>Lösenord</span>
        <a href="#" id="forgot" style="text-transform:none;letter-spacing:0;font-weight:400;font-size:12.5px;color:var(--brand2)">Glömt lösenordet?</a>
      </label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>

      <button class="btn" type="submit" id="btn">Logga in</button>
    </form>
    <div class="msg" id="msg"></div>

    <div class="foot">
      Ny här? <a href="/skapa-konto.html">Skapa spelarkonto</a> · <a href="/registrera.html">Registrera en stege</a>
    </div>
  </div>

  <div class="tp">
    <a href="/" style="display:flex;align-items:center;gap:7px">
      <svg viewBox="0 0 92 68" width="20" height="15" aria-hidden="true"><defs><linearGradient id="tpg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2E63E7"/><stop offset="100%" stop-color="#4E9BFA"/></linearGradient></defs><rect x="0" y="0" width="64" height="16" rx="8" fill="url(#tpg)"/><rect x="0" y="26" width="46" height="16" rx="8" fill="#3E7BFA" opacity="0.62"/><rect x="0" y="52" width="30" height="16" rx="8" fill="#3E7BFA" opacity="0.34"/><circle cx="78" cy="8" r="9" fill="#C6F532"/></svg>
      Drivs av Tierplay
    </a>
  </div>
</div>

<script>
const SB_URL = "https://xfzgkjapfauqdzvussbz.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhmemdramFwZmF1cWR6dnVzc2J6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwOTEzNTAsImV4cCI6MjEwMDY2NzM1MH0.vxwgXzksOa_EXPL4QIWwufVezAFbGcyzPqeFubRdVkQ";

const params = new URLSearchParams(location.search);
const stege = params.get('stege');
function esc(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
function initials(n){ return (n||'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'TP'; }

// Profilera inloggningen efter stegen man kom ifrån
if (stege) {
  fetch(`${SB_URL}/rest/v1/tierplay_public_ladders?slug=eq.${encodeURIComponent(stege)}&limit=1`,
    { headers:{ apikey:SB_KEY, Authorization:'Bearer '+SB_KEY } })
    .then(r => r.ok ? r.json() : [])
    .then(rows => {
      if (!rows.length) return;
      const d = rows[0];
      if (d.brand_primary)   document.documentElement.style.setProperty('--brand', d.brand_primary);
      if (d.brand_secondary) document.documentElement.style.setProperty('--brand2', d.brand_secondary);
      document.getElementById('brandName').textContent = d.ladder_name;
      document.getElementById('brandSub').textContent = d.club_name;
      document.getElementById('crest').innerHTML = d.logo_url
        ? `<img src="${esc(d.logo_url)}" alt="">` : esc(initials(d.ladder_name));
      document.getElementById('subtitle').textContent =
        `Logga in för att administrera ${d.ladder_name} — spelare, matcher och ställning.`;
      document.title = `Logga in — ${d.ladder_name}`;
    }).catch(()=>{});
}

document.getElementById('forgot').addEventListener('click', async ev => {
  ev.preventDefault();
  const email = document.getElementById('email').value.trim();
  const msg = document.getElementById('msg');
  if (!email) {
    msg.className = 'msg err';
    msg.textContent = 'Fyll i din e-postadress först, så skickar vi en återställningslänk.';
    document.getElementById('email').focus();
    return;
  }
  msg.className = 'msg'; msg.textContent = 'Skickar…';
  try {
    await fetch(`${SB_URL}/auth/v1/recover`, {
      method: 'POST',
      headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, options: { redirect_to: location.origin + '/valj-losenord.html' } })
    });
    // Avslöjar aldrig om adressen finns eller inte
    msg.className = 'msg ok';
    msg.textContent = 'Finns adressen hos oss är en återställningslänk på väg. Kolla inkorgen (och skräpposten).';
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = 'Kunde inte skicka just nu — försök igen om en stund.';
  }
});

document.getElementById('loginForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');
  msg.className = 'msg'; msg.textContent = '';
  btn.disabled = true; btn.textContent = 'Loggar in…';
  try{
    const res = await fetch(`${SB_URL}/auth/v1/token?grant_type=password`, {
      method:'POST',
      headers:{ apikey:SB_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) {
      msg.className = 'msg err';
      msg.textContent = (data.error_description || data.msg || '').match(/credential|Invalid/i)
        ? 'Fel e-post eller lösenord.'
        : 'Kunde inte logga in just nu. Försök igen.';
      btn.disabled = false; btn.textContent = 'Logga in';
      return;
    }
    localStorage.setItem('tp_session', JSON.stringify({
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      email: data.user && data.user.email,
      expires_at: Date.now() + (data.expires_in||3600)*1000
    }));
    msg.className = 'msg ok'; msg.textContent = 'Inloggad! 🎾';
    // Admin? Till adminvyn. Annars spelarens egen sida.
    let dest = '/min-sida.html';
    try {
      const a = await fetch(`${SB_URL}/rest/v1/tierplay_admins?select=email&limit=1`, {
        headers: { apikey: SB_KEY, Authorization: 'Bearer ' + data.access_token }
      });
      if (a.ok && (await a.json()).length) dest = stege ? `/admin.html?stege=${encodeURIComponent(stege)}` : '/admin.html';
    } catch(e) {}
    const next = params.get('next');
    location.href = next ? decodeURIComponent(next) : dest;
  }catch(e){
    msg.className = 'msg err'; msg.textContent = 'Något gick fel — försök igen.';
    btn.disabled = false; btn.textContent = 'Logga in';
  }
});
</script>
</body>
</html>
