<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gå med i stegen — Tierplay</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0B1120;--panel:#16203A;--line:rgba(235,242,250,.12);--chalk:#F0F5FA;--muted:#9AA8BC;
    --brand:#1FBF6B;--brand2:#A8E92E;--grad:linear-gradient(100deg,var(--brand),var(--brand2))}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--chalk);font-family:'Archivo',system-ui,sans-serif;font-size:17px;line-height:1.6;
    -webkit-font-smoothing:antialiased;min-height:100vh;display:grid;place-items:center;padding:32px 24px;
    background-image:radial-gradient(720px 430px at 50% -10%, color-mix(in srgb, var(--brand) 20%, transparent), transparent 62%)}
  a{color:inherit;text-decoration:none}
  .box{width:100%;max-width:430px;text-align:center}
  .crest{width:74px;height:74px;border-radius:20px;background:var(--grad);display:flex;align-items:center;justify-content:center;
    font-family:'Archivo Black',sans-serif;font-size:26px;color:#08260f;margin:0 auto 20px;overflow:hidden}
  .crest img{width:100%;height:100%;object-fit:contain;background:#fff}
  h1{font-family:'Archivo Black',sans-serif;font-size:clamp(26px,6vw,34px);text-transform:uppercase;margin-bottom:6px;line-height:1.05}
  .club{color:var(--muted);margin-bottom:6px}
  .badge{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    padding:5px 13px;border-radius:999px;background:var(--grad);color:#08260f;margin-bottom:26px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;text-align:left}
  .card p{color:var(--muted);font-size:15.5px;margin-bottom:20px}
  label{display:block;font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
  input{width:100%;background:rgba(235,242,250,.04);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;
    color:var(--chalk);font-size:18px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;
    text-transform:uppercase;text-align:center;outline:none;transition:border-color .15s}
  input:focus{border-color:var(--brand)}
  .btn{width:100%;margin-top:18px;padding:14px;border-radius:999px;font-weight:600;font-size:16px;background:var(--grad);
    color:#08260f;border:none;cursor:pointer;font-family:inherit;transition:transform .15s;display:block;text-align:center}
  .btn:hover{transform:translateY(-1px)}
  .btn:disabled{opacity:.55;transform:none;cursor:default}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--chalk)}
  .msg{margin-top:14px;font-size:14.5px;min-height:20px;text-align:center}
  .msg.err{color:#FF8B7E}.msg.ok{color:var(--brand2)}
  .done .ball{font-size:52px;margin-bottom:14px;text-align:center}
  .done h2{font-family:'Archivo Black',sans-serif;font-size:23px;text-transform:uppercase;margin-bottom:10px;text-align:center}
  .done p{text-align:center}
  .tp{margin-top:24px;font-size:13px;color:var(--muted)}
  .hide{display:none}
</style>
</head>
<body>
<div class="box">

  <!-- Laddar / okänd kod -->
  <div id="loading"><p style="color:#9AA8BC">Hämtar stegen…</p></div>

  <!-- Ingen kod i länken: be om den -->
  <div id="askCode" class="hide">
    <div class="crest">🎾</div>
    <h1>Gå med i en stege</h1>
    <p class="club" style="margin-bottom:24px">Har du fått en kod eller QR av din klubb? Fyll i koden så kopplas du till rätt stege.</p>
    <div class="card">
      <label for="code">Anslutningskod</label>
      <input type="text" id="code" placeholder="ABCD2345" maxlength="8" autocomplete="off" autocapitalize="characters">
      <button class="btn" onclick="lookup()">Hitta stegen</button>
      <div class="msg" id="codeMsg"></div>
    </div>
  </div>

  <!-- Hittad stege -->
  <div id="found" class="hide">
    <div class="crest" id="crest"></div>
    <h1 id="ladderName"></h1>
    <p class="club" id="clubName"></p>
    <span class="badge" id="typeBadge"></span>
    <div class="card">
      <p id="lead"></p>
      <div id="actions"></div>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <!-- Klart -->
  <div id="done" class="hide">
    <div class="card done">
      <div class="ball">🎾</div>
      <h2 id="doneTitle"></h2>
      <p id="doneText" style="color:var(--muted)"></p>
      <a class="btn" href="/min-sida.html" style="margin-top:22px">Till min sida</a>
    </div>
  </div>

  <div class="tp"><a href="/">Drivs av Tierplay</a></div>
</div>

<script>
const SB_URL = "https://xfzgkjapfauqdzvussbz.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhmemdramFwZmF1cWR6dnVzc2J6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwOTEzNTAsImV4cCI6MjEwMDY2NzM1MH0.vxwgXzksOa_EXPL4QIWwufVezAFbGcyzPqeFubRdVkQ";
const TYPES = { vanlig:'Vanlig stege', sommar:'Sommarstege', pool:'Poolspel' };

let session = null;
try { session = JSON.parse(localStorage.getItem('tp_session')||'null'); } catch(e){}

const params = new URLSearchParams(location.search);
let code = (params.get('kod') || params.get('code') || '').trim().toUpperCase();

function esc(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
function initials(n){ return (n||'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'TP'; }
function show(id){ ['loading','askCode','found','done'].forEach(x =>
  document.getElementById(x).classList.toggle('hide', x !== id)); }

async function lookupCode(c){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/tierplay_ladder_by_code`, {
    method:'POST', headers:{ apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ p_code: c })
  });
  if (!r.ok) return null;
  const rows = await r.json();
  return rows && rows.length ? rows[0] : null;
}

async function lookup(){
  const c = document.getElementById('code').value.trim().toUpperCase();
  const m = document.getElementById('codeMsg');
  if (c.length < 4) { m.className='msg err'; m.textContent='Fyll i koden du fått av klubben.'; return; }
  m.className='msg'; m.textContent='Söker…';
  const d = await lookupCode(c);
  if (!d) { m.className='msg err'; m.textContent='Ingen stege med den koden. Kolla att du skrivit rätt.'; return; }
  code = c;
  render(d);
}

function render(d){
  if (d.brand_primary)   document.documentElement.style.setProperty('--brand', d.brand_primary);
  if (d.brand_secondary) document.documentElement.style.setProperty('--brand2', d.brand_secondary);

  document.getElementById('crest').innerHTML = d.logo_url
    ? `<img src="${esc(d.logo_url)}" alt="">` : esc(initials(d.ladder_name));
  document.getElementById('ladderName').textContent = d.ladder_name;
  document.getElementById('clubName').textContent = d.club_name + (d.location ? ' · ' + d.location : '');
  document.getElementById('typeBadge').textContent = TYPES[d.play_type] || d.play_type;
  document.title = `Gå med i ${d.ladder_name} — Tierplay`;

  const lead = document.getElementById('lead');
  const actions = document.getElementById('actions');

  if (session && session.access_token) {
    lead.textContent = `Du är inloggad som ${session.email}. Anmäl dig så får klubben din ansökan.`;
    actions.innerHTML = `<button class="btn" id="joinBtn">Gå med i ${esc(d.ladder_name)}</button>`;
    document.getElementById('joinBtn').addEventListener('click', join);
  } else {
    lead.textContent = 'Logga in med din spelarprofil, eller skapa en om du är ny. Sen är du med.';
    const back = encodeURIComponent(`/ga-med.html?kod=${code}`);
    actions.innerHTML = `
      <a class="btn" href="/skapa-konto.html?kod=${esc(code)}">Skapa spelarkonto</a>
      <a class="btn ghost" style="margin-top:10px" href="/login.html?next=${back}">Jag har redan konto</a>`;
  }
  show('found');
}

async function join(){
  const btn = document.getElementById('joinBtn');
  const msg = document.getElementById('msg');
  btn.disabled = true; btn.textContent = 'Anmäler…';
  try {
    const r = await fetch(`${SB_URL}/rest/v1/rpc/tierplay_join_by_code`, {
      method:'POST',
      headers:{ apikey:SB_KEY, Authorization:'Bearer '+session.access_token, 'Content-Type':'application/json' },
      body: JSON.stringify({ p_code: code })
    });
    const res = await r.json();
    if (!r.ok || !res.ok) {
      if (res && res.error === 'no_profile') { location.href = `/min-sida.html?kod=${code}`; return; }
      if (res && res.error === 'not_logged_in') { location.href = `/login.html?next=${encodeURIComponent('/ga-med.html?kod='+code)}`; return; }
      msg.className='msg err';
      msg.textContent = res && res.error === 'bad_code' ? 'Koden gäller inte längre.' : 'Kunde inte anmäla just nu.';
      btn.disabled = false; btn.textContent = 'Försök igen';
      return;
    }
    document.getElementById('doneTitle').textContent =
      res.status === 'member' ? 'Du är med!' : 'Ansökan skickad';
    document.getElementById('doneText').textContent =
      res.status === 'member'
        ? `Du är med i ${res.ladder_name}. Stegen dyker upp på din sida.`
        : `${res.club_name} får din ansökan till ${res.ladder_name} och godkänner den. Sen syns stegen på din sida.`;
    show('done');
  } catch(e) {
    msg.className='msg err'; msg.textContent='Något gick fel — försök igen.';
    btn.disabled = false; btn.textContent = 'Försök igen';
  }
}

(async () => {
  if (!code) { show('askCode'); return; }
  const d = await lookupCode(code);
  if (!d) {
    show('askCode');
    document.getElementById('codeMsg').className = 'msg err';
    document.getElementById('codeMsg').textContent = 'Koden i länken stämmer inte. Skriv in den för hand.';
    return;
  }
  render(d);
})();
</script>
</body>
</html>
